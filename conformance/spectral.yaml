# Spectral ruleset — rest-api-standard conformance fixtures (Phase 3 draft).
#
# Drafted from the pinned patterns in rest-api-standard.md Part I; rule IDs
# in each description cite the standard.
# Status: execution-verified 2026-08-10 with @stoplight/spectral-cli 6.16.3
# against fixture-violations.yaml in this directory — all fourteen expected
# findings fired (8 errors, 6 warnings), twelve from v1.0.0 plus the two §13
# rules added in v1.1.0; the $ref-only envelope schema is
# deliberately not traversed (see per-rule descriptions for known
# limits). Command:
#   npx @stoplight/spectral-cli lint --ruleset conformance/spectral.yaml \
#     conformance/fixture-violations.yaml
extends: []
rules:
  rs-r2-4-path-segments-kebab-case:
    description: "R2.4 - path segments are kebab-case (^[a-z][a-z\\-0-9]*$); {parameter} segments exempt"
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^(/([a-z][a-z\\-0-9]*|\\{[^}]+\\}))+$"
  rs-r4-4-body-properties-snake-case:
    description: "R4.4 - body property names match ^[a-z_][a-z_0-9]*$"
    severity: error
    given: "$..properties[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z_][a-z_0-9]*$"
  rs-r4-4-query-parameters-snake-case:
    description: "R4.4 / R6.8 - query parameter names match ^[a-z][_a-z0-9]*$, plus only the enumerated bracket range suffixes [gte] [gt] [lte] [lt]"
    severity: error
    given: "$..parameters[?(@.in == 'query')].name"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][_a-z0-9]*(\\[(gte|gt|lte|lt)\\])?$"
  rs-r10-9-202-operation-location:
    description: "R10.9 - 202 responses declare a Location header for the operation resource (SHOULD-strength). Documented false negatives: the body-identity MUST, the absolute-URI form, and header/body agreement are not statically checked here - the Appendix G live-probe table covers them. $ref'd Response Objects may warn spuriously"
    severity: warn
    given: "$.paths[*][*].responses['202']"
    then:
      field: "headers.Location"
      function: truthy
  rs-r4-16-path-parameters-snake-case:
    description: "R4.16 - path parameter names (in: path) match ^[a-z_][a-z_0-9]*$ (snake_case, body-property grammar)"
    severity: error
    given: "$..parameters[?(@.in == 'path')].name"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z_][a-z_0-9]*$"
  rs-s1-10-no-new-x-headers:
    description: "Section 1.10 - no new X- prefixed header fields (RFC 6648); covers request header parameters, inline response headers, and reusable components.headers. The standard bans only NEW X- names: where a contract must document a pre-existing third-party X- field, suppress that instance with a Spectral override"
    severity: error
    given:
      - "$..parameters[?(@.in == 'header')].name"
      - "$.paths[*][*].responses[*].headers[*]~"
      - "$.components.headers[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "^[Xx]-"
  rs-r5-6-create-returns-location:
    description: "R5.6 - 201 responses declare a Location header (POST and PUT creates alike). Heuristic at warn severity: R5.6 binds single-resource creates only, so an atomic bulk 201, a $ref'd Response Object, or a lowercase 'location' key may warn spuriously - suppress per instance with a Spectral override"
    severity: warn
    given:
      - "$.paths[*].post.responses['201']"
      - "$.paths[*].put.responses['201']"
    then:
      field: "headers.Location"
      function: truthy
  rs-r4-3-top-level-object:
    description: "R4.3 / R6.1 - every application/json response schema is either a $ref or declares type object. Known limits: $ref targets are not traversed (a $ref to a non-object false-passes), and media types other than exact application/json (problem+json, vendor +json) are not inspected"
    severity: warn
    given: "$.paths[*][*].responses[*].content['application/json'].schema"
    then:
      - function: xor
        functionOptions:
          properties: ["$ref", "type"]
      - field: "type"
        function: pattern
        functionOptions:
          match: "^object$"
  rs-r13-1-no-streaming-202:
    description: "R13.1 - a 202 response never carries a streaming representation: 202 is bound to an operation resource by R10.1, so a streaming 202 forks that contract. Checks for a stream media type declared under a 202. Known limit: a vendor stream media type this pattern does not name will not fire"
    severity: error
    given: "$.paths[*][*].responses['202'].content[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "^(text/event-stream|application/(x-ndjson|jsonl|json-seq))$"
  rs-r13-2-stream-negotiation-vary:
    description: "R13.2 / R4.11 - a response offering both a JSON and a stream representation selects between them on Accept, and so declares Vary. Applies to any status code, since R4.11 binds every header-selected response. Heuristic at warn severity: the header key is matched case-sensitively as 'Vary', and a $ref'd Response Object will warn spuriously - suppress per instance with a Spectral override"
    severity: warn
    given: "$.paths[*][*].responses[?(@.content && @.content['application/json'] && (@.content['text/event-stream'] || @.content['application/x-ndjson']))]"
    then:
      field: "headers.Vary"
      function: truthy
  rs-r5-13-problem-code-grammar:
    description: "R5.13 - problem code const values match ^[a-z][a-z0-9_]*$ (snake_case, hyphens excluded). Spot-check heuristic: only const-declared codes are inspected (enum/pattern/$ref forms are not), and an unrelated schema with a code const may warn"
    severity: warn
    given: "$..properties.code.const"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-z0-9_]*$"
