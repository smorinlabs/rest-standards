# Verification fixture for spectral.yaml — a deliberately violating OpenAPI
# document. Expected: 14 findings (8 errors, 6 warnings): camelCase query
# param, body property, and path parameter, non-kebab path segment, X-
# header in all three positions (request parameter, inline response header,
# components.headers), POST 201 and PUT 201 each without Location, a 202
# without Location, two schemas with neither $ref nor type, and — added in
# v1.1.0 with §13 — a streaming 202 and a both-representations 200 with no
# Vary. The $ref-only envelope schema on GET /v1/orders 200 must NOT be
# flagged. Each streaming case is isolated: the streaming 202 declares a
# Location so it trips R13.1 alone rather than R10.9 as well.
openapi: 3.1.0
info:
  title: Fixture API (deliberate violations for ruleset verification)
  version: 0.0.1
paths:
  /v1/orders:
    get:
      parameters:
        - name: goodParamNo
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: envelope by ref (should pass top-level-object via $ref)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/order_collection"
    post:
      responses:
        "201":
          description: created but no Location header (should warn R5.6)
          content:
            application/json:
              schema:
                properties:
                  badCamelCase:
                    type: string
  /v1/settings/{setting_id}:
    put:
      responses:
        "201":
          description: PUT create with client-supplied ID but no Location (should warn R5.6)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/order_collection"
  /v1/order-imports:
    post:
      responses:
        "202":
          description: accepted without a Location header (should warn R10.9); body identity itself conforms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/operation"
  /v1/order-exports/{export_id}/stream:
    get:
      responses:
        "202":
          description: a streaming 202 (should error R13.1 only) — Location is present so R10.9 stays quiet and this case isolates the R13.1 violation
          headers:
            Location:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: object
  /v1/order-exports/{export_id}/events:
    get:
      responses:
        "200":
          description: offers both representations but declares no Vary (should warn R13.2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/order_collection"
            text/event-stream:
              schema:
                type: object
  /v1/widgets/{widgetId}:
    get:
      parameters:
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: camelCase path parameter (should error R4.16)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/order_collection"
  /v1/BadSegment/{order_id}/items:
    get:
      parameters:
        - name: X-Legacy-Header
          in: header
          schema:
            type: string
      responses:
        "200":
          description: inline schema missing type (should warn xor) and X- response header
          headers:
            X-Trace-Debug:
              schema:
                type: string
          content:
            application/json:
              schema:
                properties:
                  ok:
                    type: boolean
components:
  headers:
    X-Reusable-Bad:
      schema:
        type: string
  schemas:
    operation:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        status:
          type: string
    order_collection:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: string
